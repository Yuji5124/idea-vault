services:
  - type: web
    name: idea-vault
    runtime: python
    plan: starter
    buildCommand: python3 -m unittest discover -s tests -v
    startCommand: python3 server.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: IDEA_VAULT_DATA
        value: /var/data/vault
      - key: IDEA_VAULT_PASSWORD
        generateValue: true
    disk:
      name: idea-vault-data
      mountPath: /var/data
      sizeGB: 1
